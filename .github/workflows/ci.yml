name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install frontend dependencies and build
      run: |
        npm ci
        npm run build:web

    - name: Check formatting
      run: cargo fmt --check

    - name: Check
      run: cargo check --all-targets --all-features

    - name: Validate Zero Deprecated Code
      run: |
        # Fail if any #[deprecated] attributes found in crates/
        if grep -r "#\[deprecated\]" crates/ --include="*.rs"; then
          echo "ERROR: Found deprecated code in codebase"
          exit 1
        fi

        # Fail if compiler emits deprecation warnings from our own code
        # Filter to only warnings from crates/code-viz paths (not external deps)
        if cargo build --all-targets --all-features 2>&1 | grep -i "warning:.*deprecated" | grep "crates/code-viz"; then
          echo "ERROR: Found deprecation warnings in our codebase"
          exit 1
        fi

        echo "SUCCESS: Zero deprecated code found"

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check for unwrap() in production code
      run: |
        # Install ripgrep if not available (usually pre-installed on GitHub runners)
        if ! command -v rg &> /dev/null; then
          if [ "$RUNNER_OS" = "Linux" ]; then
            curl -LO https://github.com/BurntSushi/ripgrep/releases/download/13.0.0/ripgrep_13.0.0_amd64.deb
            sudo dpkg -i ripgrep_13.0.0_amd64.deb
          else
            cargo install ripgrep
          fi
        fi

        ./scripts/check-unwrap.sh

    - name: Test
      # Skipping watch tests in CI due to flakiness
      run: cargo test --all-targets --all-features

    - name: Build Release
      run: cargo build --release --verbose

    - name: Dogfood Analysis (Unix)
      if: runner.os != 'Windows'
      run: |
        ./target/release/code-viz-cli analyze . --format text --verbose
        ./target/release/code-viz-cli analyze . --threshold loc=10000 --verbose

    - name: Dogfood Analysis (Windows)
      if: runner.os == 'Windows'
      run: |
        .\target\release\code-viz-cli.exe analyze . --format text --verbose

  contract-tests:
    name: Contract Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build frontend
      run: |
        npm ci
        npm run build:web

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Build contract tests
      run: cargo nextest run --package code-viz-tauri --test contract_tests --no-run

    - name: Run Contract Tests
      run: |
        # Enforce performance: tests must complete in < 5 seconds
        timeout 5s cargo nextest run --package code-viz-tauri --test contract_tests

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build frontend
      run: |
        npm ci
        npm run build:web

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

    - name: Upload to codecov.io
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false

    - name: Generate coverage report
      run: |
        cargo llvm-cov report --summary-only
        echo "📊 Coverage report generated"
