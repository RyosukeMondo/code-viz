name: Coverage Gates

on:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-coverage:
    name: Rust Coverage Gate (80% minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage with threshold check
        id: coverage
        run: |
          # Generate coverage report
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

          # Get coverage percentage
          COVERAGE=$(cargo llvm-cov --all-features --workspace --summary-only | grep -oP 'TOTAL\s+\d+\s+\d+\s+\K[\d.]+' || echo "0")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "📊 Total coverage: ${COVERAGE}%"

          # Check if coverage meets 80% threshold
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below the 80% threshold"
            echo ""
            echo "Files with low coverage:"
            cargo llvm-cov --all-features --workspace report --lcov --output-path - | grep -A 5 "SF:" | head -20
            exit 1
          fi

          echo "✅ Coverage $COVERAGE% meets the 80% threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          fail_ci_if_error: false

      - name: Comment coverage on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const threshold = 80;
            const passed = parseFloat(coverage) >= threshold;
            const emoji = passed ? '✅' : '❌';

            const body = `## ${emoji} Rust Coverage Report

            **Coverage**: ${coverage}%
            **Threshold**: ${threshold}%
            **Status**: ${passed ? 'PASSED' : 'FAILED'}

            ${passed ?
              '✅ Coverage meets the minimum threshold!' :
              '❌ Coverage is below the minimum threshold. Please add tests to increase coverage.'
            }

            [View detailed coverage report on Codecov](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.pull_request.number }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  typescript-coverage:
    name: TypeScript Coverage Gate (80% minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: coverage
        run: |
          # Run tests and capture output
          npm run test:coverage -- --reporter=verbose --coverage.enabled=true --coverage.reporter=json-summary --coverage.reporter=text

          # Extract coverage percentage from coverage-summary.json
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -p "Math.round(require('./coverage/coverage-summary.json').total.lines.pct)")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "📊 Total line coverage: ${COVERAGE}%"

            # Check if coverage meets 80% threshold
            if [ "$COVERAGE" -lt 80 ]; then
              echo "❌ Coverage ${COVERAGE}% is below the 80% threshold"
              echo ""
              echo "Coverage breakdown:"
              cat coverage/coverage-summary.json | node -p "
                const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
                Object.entries(data)
                  .filter(([key]) => key !== 'total')
                  .map(([file, metrics]) => \`\${file}: \${metrics.lines.pct}%\`)
                  .slice(0, 10)
                  .join('\\n')
              "
              exit 1
            fi

            echo "✅ Coverage ${COVERAGE}% meets the 80% threshold"
          else
            echo "❌ Coverage report not found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: false

      - name: Comment coverage on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const threshold = 80;
            const passed = parseFloat(coverage) >= threshold;
            const emoji = passed ? '✅' : '❌';

            const body = `## ${emoji} TypeScript Coverage Report

            **Coverage**: ${coverage}%
            **Threshold**: ${threshold}%
            **Status**: ${passed ? 'PASSED' : 'FAILED'}

            ${passed ?
              '✅ Coverage meets the minimum threshold!' :
              '❌ Coverage is below the minimum threshold. Please add tests to increase coverage.'
            }

            [View detailed coverage report on Codecov](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.pull_request.number }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [rust-coverage, typescript-coverage]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 📊 Coverage Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All coverage gates have been evaluated." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Rust Coverage**: ${{ needs.rust-coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Coverage**: ${{ needs.typescript-coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.rust-coverage.result }}" = "success" ] && [ "${{ needs.typescript-coverage.result }}" = "success" ]; then
            echo "✅ All coverage gates passed! Minimum 80% coverage maintained." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "❌ One or more coverage gates failed. Please add tests to meet the 80% threshold." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
